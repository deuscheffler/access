name: omega_access
description: Omega Access Control, versión sin conexión con nómina incluida.
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  mobile_scanner: ^5.2.3
  qr_flutter: ^4.1.0
  crypto: ^3.0.3
  path_provider: ^2.1.4
  share_plus: ^10.1.0
  pdf: ^3.11.1
  url_launcher: ^6.3.1

flutter:
  uses-material-design: true
  assets:
    - assets/nomina.json
    - assets/img/
    - assets/fonts/
  fonts:
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Regular.ttf
        - asset: assets/fonts/Barlow-Medium.ttf
          weight: 500
        - asset: assets/fonts/Barlow-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Barlow-Bold.ttf
          weight: 700
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/BarlowCondensed-ExtraBold.ttf
          weight: 800
