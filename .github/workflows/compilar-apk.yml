name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Generar carpeta android
        run: flutter create --org com.omegatelecom --project-name omega_access --platforms android .

      - name: Configurar Android
        run: bash tool/configurar_android.sh

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar APK
        run: flutter build apk --release

      - name: Renombrar APK
        run: cp build/app/outputs/flutter-apk/app-release.apk omega-access-demo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: omega-access-demo
          path: omega-access-demo.apk
